<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Allenamenti - Gestionale San Giovanni</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="assets/stemma.png" alt="Stemma San Giovanni">
      <span>Gestionale<br>San Giovanni</span>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">🏠 Dashboard</a>
      <a href="giocatori.html">👥 Giocatori</a>
      <a href="allenamenti.html" class="active">📋 Allenamenti</a>
      <a href="esercizi.html">🏃 Esercizi</a>
      <a href="rapporti.html">📝 Rapporti</a>
      <a href="calendario.html">📅 Calendario</a>
    </nav>
    <div class="sidebar-logout">
      <button id="btnLogout">Esci</button>
    </div>
  </aside>

  <div class="main-area">
    <div class="topbar">
      <div class="topbar-ricerca">
        <input type="text" id="ricercaGlobale" placeholder="Cerca giocatore o allenamento...">
        <div class="topbar-risultati" id="topbarRisultati"></div>
      </div>
    </div>

  <div class="container">
    <div class="section-title">
      <h2>Allenamenti</h2>
      <button class="btn-primary" id="btnNuovoAllenamento">+ Nuovo allenamento</button>
    </div>

    <div id="listaAllenamenti">
      <div class="loading">Caricamento allenamenti...</div>
    </div>
  </div>
  </div>
  </div>

  <!-- ===== MODALE ALLENAMENTO ===== -->
  <div class="overlay" id="overlayAllenamento">
    <div class="modale" style="max-width:600px;">
      <h2 id="modaleTitoloAll">Allenamento</h2>

      <div class="campo">
        <label>Titolo</label>
        <input type="text" id="campoTitolo" placeholder="Es. Allenamento di avvio">
      </div>

      <div style="display:flex; gap:12px;">
        <div class="campo" style="flex:1;">
          <label>Data</label>
          <input type="date" id="campoData">
        </div>
        <div class="campo" style="flex:1;">
          <label>Ora</label>
          <input type="time" id="campoOra">
        </div>
      </div>

      <div style="display:flex; gap:12px;">
        <div class="campo" style="flex:1;">
          <label>Luogo</label>
          <input type="text" id="campoLuogo" placeholder="Es. San Giovanni">
        </div>
        <div class="campo" style="flex:1;">
          <label>Tipo</label>
          <select id="campoTipo">
            <option value="Normale">Normale</option>
            <option value="Diagnostico">Diagnostico</option>
            <option value="Partita">Partita</option>
            <option value="Recupero">Recupero</option>
          </select>
        </div>
      </div>

      <div class="campo">
        <label>Note</label>
        <textarea id="campoNote" rows="3" placeholder="Note sulla sessione..."></textarea>
      </div>

      <div class="campo">
        <label>Aggiungi dalla libreria esercizi</label>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <select id="selCategoriaLibreria" style="flex:1; min-width:140px; padding:8px; border:1px solid var(--bordo); border-radius:6px;">
            <option value="">Categoria...</option>
          </select>
          <select id="selEsercizioLibreria" style="flex:2; min-width:180px; padding:8px; border:1px solid var(--bordo); border-radius:6px;" disabled>
            <option value="">Scegli prima la categoria</option>
          </select>
          <button type="button" class="btn-secondary" id="btnAggiungiDaLibreria">+ Aggiungi</button>
        </div>
        <p id="descEsercizioLibreria" style="font-size:0.85rem; color:var(--testo-chiaro); margin-top:6px; min-height:18px;"></p>
      </div>

      <div class="campo">
        <label>Esercizi della sessione</label>
        <div id="listaEserciziForm"></div>
        <button type="button" class="btn-secondary" id="btnAggiungiEsercizio" style="margin-top:8px;">+ Aggiungi esercizio manuale</button>
      </div>

      <div class="modale-azioni">
        <button class="btn-danger" id="btnEliminaAllenamento" style="display:none;">Elimina</button>
        <button class="btn-secondary" id="btnAnnullaAllenamento">Annulla</button>
        <button class="btn-primary" id="btnSalvaAllenamento">Salva</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/search.js"></script>
  <script type="module" src="js/allenamenti.js"></script>
</body>
</html>
