<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galleria - Gestionale San Giovanni</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="assets/stemma.png" alt="Stemma San Giovanni">
      <span>Gestionale<br>San Giovanni</span>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">🏠 Dashboard</a>
      <a href="giocatori.html">👥 Giocatori</a>
      <a href="allenamenti.html">📋 Allenamenti</a>
      <a href="esercizi.html">🏃 Esercizi</a>
      <a href="rapporti.html">📝 Rapporti</a>
      <a href="calendario.html">📅 Calendario</a>
      <a href="galleria.html" class="active">📸 Galleria</a>
      <a href="stagioni.html">🗓️ Stagioni</a>
    </nav>
    <div class="sidebar-logout">
      <button id="btnLogout">Esci</button>
    </div>
  </aside>

  <div class="main-area">
    <div class="topbar">
      <div class="topbar-ricerca">
        <input type="text" id="ricercaGlobale" placeholder="Cerca giocatore o allenamento...">
        <div class="topbar-risultati" id="topbarRisultati"></div>
      </div>
    </div>

  <div class="container">
    <div class="section-title">
      <h2>Galleria foto</h2>
      <label class="btn-primary" style="cursor:pointer;">
        + Aggiungi foto
        <input type="file" id="inputCaricaFoto" accept="image/*" multiple style="display:none;">
      </label>
    </div>

    <p id="statoCaricamento" style="color:var(--testo-chiaro); font-size:0.85rem; margin-bottom:14px; display:none;"></p>

    <div class="galleria-grid" id="galleriaGrid">
      <div class="loading">Caricamento foto...</div>
    </div>
  </div>
  </div>
  </div>

  <!-- ===== LIGHTBOX FOTO ===== -->
  <div class="overlay" id="overlayLightbox">
    <div class="modale" style="max-width:800px; text-align:center;">
      <img id="lightboxImg" src="" alt="" style="max-width:100%; max-height:70vh; border-radius:8px; object-fit:contain;">
      <p id="lightboxNome" style="margin-top:12px; color:var(--testo-chiaro);"></p>
      <div class="modale-azioni" style="justify-content:center;">
        <button class="btn-danger" id="btnEliminaFoto">Elimina foto</button>
        <button class="btn-secondary" id="btnChiudiLightbox">Chiudi</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/search.js"></script>
  <script type="module" src="js/galleria.js"></script>
</body>
</html>
