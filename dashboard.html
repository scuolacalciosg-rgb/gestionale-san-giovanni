<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Gestionale San Giovanni</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="assets/stemma.png" alt="Stemma San Giovanni">
      <span>Gestionale<br>San Giovanni</span>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="active">🏠 Dashboard</a>
      <a href="giocatori.html">👥 Giocatori</a>
      <a href="allenamenti.html">📋 Allenamenti</a>
      <a href="esercizi.html">🏃 Esercizi</a>
      <a href="rapporti.html">📝 Rapporti</a>
    </nav>
    <div class="sidebar-logout">
      <button id="btnLogout">Esci</button>
    </div>
  </aside>

  <div class="main-area">
    <div class="topbar">
      <div class="topbar-ricerca">
        <input type="text" id="ricercaGlobale" placeholder="Cerca giocatore o allenamento...">
        <div class="topbar-risultati" id="topbarRisultati"></div>
      </div>
    </div>

  <div class="container">
    <div class="dash-titolo">
      <img src="assets/stemma.png" alt="Stemma San Giovanni" class="dash-titolo-stemma">
      <div>
        <h1>PRIMI CALCI</h1>
        <p id="dataOggi"></p>
      </div>
    </div>

    <div id="visiteScadenza"></div>

    <div class="dash-colonne">
      <div class="dash-colonna">
        <div class="section-title">
          <h2>📰 Ultime comunicazioni</h2>
        </div>
        <div id="ultimeNotizie">
          <div class="loading">Caricamento...</div>
        </div>
      </div>

      <div class="dash-colonna">
        <div class="section-title">
          <h2>Prossimi allenamenti</h2>
        </div>
        <div id="prossimoAllenamento">
          <div class="loading">Caricamento...</div>
        </div>
      </div>
    </div>
  </div>
  </div>
  </div>

  <script type="module" src="js/search.js"></script>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
