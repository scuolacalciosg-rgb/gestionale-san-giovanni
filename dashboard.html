<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Gestionale San Giovanni</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-header">
    <div class="brand"><img src="assets/stemma.png" alt="Stemma San Giovanni"><h1>Gestionale San Giovanni</h1></div>
    <nav>
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="giocatori.html">Giocatori</a>
      <a href="allenamenti.html">Allenamenti</a>
      <a href="esercizi.html">Esercizi</a>
    </nav>
    <button class="logout-btn" id="btnLogout">Esci</button>
  </header>

  <div class="container">
    <div class="dash-titolo">
      <img src="assets/stemma.png" alt="Stemma San Giovanni" class="dash-titolo-stemma">
      <div>
        <h1>PRIMI CALCI</h1>
        <p id="dataOggi"></p>
      </div>
    </div>

    <div id="visiteScadenza"></div>

    <div class="dash-colonne">
      <div class="dash-colonna">
        <div class="section-title">
          <h2>📰 Ultime comunicazioni</h2>
        </div>
        <div id="ultimeNotizie">
          <div class="loading">Caricamento...</div>
        </div>
      </div>

      <div class="dash-colonna">
        <div class="section-title">
          <h2>Prossimi allenamenti</h2>
        </div>
        <div id="prossimoAllenamento">
          <div class="loading">Caricamento...</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
